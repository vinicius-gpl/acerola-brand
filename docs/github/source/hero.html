<!doctype html>
<!--
	Fonte da imagem de capa do README (docs/github/ptbr/hero.jpg), no mesmo molde das capas do
	acerola-reader e do acerola-sync: logo no canto, telas no meio e a frase à direita.
	Cores e fontes vêm da própria marca (static/brand/css), nada de hex solto.
	Para gerar de novo: `node docs/github/source/render-hero.mjs` (precisa do Chrome).
-->
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../../../acerola-brand/static/brand/css/tokens.css" />
		<link rel="stylesheet" href="../../../acerola-brand/static/brand/css/fonts.css" />
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				background:
					radial-gradient(1200px 700px at 78% 18%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 70%),
					radial-gradient(900px 600px at 20% 90%, color-mix(in oklab, var(--accent-hero) 12%, transparent), transparent 70%),
					var(--crust);
				font-family: 'DM Sans', sans-serif;
				color: var(--foreground);
				position: relative;
			}
			/* Subtle grain, as on the reader's cover. */
			body::after {
				content: '';
				position: absolute;
				inset: 0;
				opacity: 0.07;
				background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
				pointer-events: none;
			}
			.brand {
				position: absolute;
				top: 72px;
				left: 82px;
				display: flex;
				align-items: center;
				gap: 26px;
			}
			.brand img {
				width: 62px;
				height: 62px;
			}
			.brand span {
				font-size: 48px;
				font-weight: 900;
				letter-spacing: -0.02em;
			}
			.stage {
				position: absolute;
				left: 230px;
				top: 215px;
				width: 1120px;
				height: 760px;
				perspective: 2400px;
			}
			.window {
				position: absolute;
				left: 330px;
				top: 0;
				width: 860px;
				border-radius: 18px;
				overflow: hidden;
				background: var(--mantle);
				box-shadow:
					0 40px 90px -20px color-mix(in oklab, var(--crust) 80%, transparent),
					0 0 0 1px color-mix(in oklab, var(--foreground) 6%, transparent);
				transform: rotateY(-16deg) rotateX(3deg);
				transform-origin: left center;
				opacity: 0.92;
			}
			.window .bar {
				height: 34px;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 14px;
				background: var(--card);
			}
			.window .bar i {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--surface);
			}
			.window .bar b {
				margin-left: 18px;
				height: 18px;
				width: 340px;
				border-radius: 9px;
				background: var(--surface);
			}
			.window img {
				display: block;
				width: 100%;
				height: 560px;
				object-fit: cover;
				object-position: top;
			}
			.phone {
				position: absolute;
				border-radius: 28px;
				overflow: hidden;
				background: var(--background);
				box-shadow:
					0 50px 100px -24px color-mix(in oklab, var(--crust) 90%, transparent),
					0 0 0 1px color-mix(in oklab, var(--foreground) 8%, transparent);
			}
			.phone img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: top;
			}
			.phone.main {
				left: 20px;
				top: 60px;
				width: 330px;
				height: 600px;
				z-index: 2;
			}
			.phone.side {
				left: 400px;
				top: 170px;
				width: 330px;
				height: 560px;
				z-index: 1;
			}
			.tagline {
				position: absolute;
				left: 1490px;
				top: 400px;
				width: 370px;
				font-size: 46px;
				line-height: 1.14;
				font-weight: 900;
				letter-spacing: -0.02em;
				color: var(--foreground);
			}
			.tagline em {
				font-style: normal;
				color: var(--primary);
			}
		</style>
	</head>
	<body>
		<div class="brand">
			<img src="../../../acerola-brand/static/brand/logo/acerola-logo-foreground.svg" alt="" />
			<span>Acerola Brand</span>
		</div>

		<div class="stage">
			<div class="window">
				<div class="bar"><i></i><i></i><i></i><b></b></div>
				<img src="../ptbr/prints/dark/home-colors.webp" alt="" />
			</div>
			<div class="phone side"><img src="../ptbr/prints/dark/mobile-app.webp" alt="" /></div>
			<div class="phone main"><img src="../ptbr/prints/dark/mobile-home.webp" alt="" /></div>
		</div>

		<p class="tagline">Um padrão só, <em>a mesma cara</em> em todo app Acerola.</p>
	</body>
</html>
